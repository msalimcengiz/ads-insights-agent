name: adsagent

services:
  api:
    build: .
    environment:
      DATABASE_URL: postgres://ads:ads@postgres:5432/ads
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AS_OF_DATE: "2026-10-20"
      AGENT_EFFORT: ${AGENT_EFFORT:-medium}
      AGENT_MODEL: ${AGENT_MODEL:-claude-opus-5-5}
    ports: ["3001:3000"]
    depends_on:
      postgres: { condition: service_healthy }

  # Executes queued runs; scale with `docker compose up --scale worker=N`.
  worker:
    build: .
    command: ["node", "dist/worker.js"]
    environment:
      DATABASE_URL: postgres://ads:ads@postgres:5432/ads
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AS_OF_DATE: "2026-10-20"
      AGENT_EFFORT: ${AGENT_EFFORT:-medium}
      AGENT_MODEL: ${AGENT_MODEL:-claude-opus-5-5}
      WORKER_CONCURRENCY: "4"
    restart: unless-stopped
    stop_grace_period: 120s
    depends_on:
      postgres: { condition: service_healthy }

  postgres:
    image: postgres:17-alpine
    environment: { POSTGRES_USER: ads, POSTGRES_PASSWORD: ads, POSTGRES_DB: ads }
    volumes: ["./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro"]
    ports: ["5435:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ads"]
      interval: 2s
      retries: 30
