<text x="480.0" y="20" text-anchor="middle" style="fill:#8b949e;font-size:12px">ads-insights-agent · make demo</text>
<text class="l" style="animation-name:k0" x="16" y="60"><tspan class="p">$</tspan> make demo</text>
<text class="l" style="animation-name:k1" x="16" y="78">No ANTHROPIC_API_KEY: using the scripted demo model. Set the key to run the same demo with Claude.</text>
<text class="l" style="animation-name:k2" x="16" y="96">Starting the stack (API, worker, Postgres) and seeding demo ad data…</text>
<text class="l" style="animation-name:k3" x="16" y="114">   seeded: { campaigns: 18, rows: 1590 }</text>
<text class="l" style="animation-name:k4" x="16" y="132"></text>
<text class="l" style="animation-name:k5" x="16" y="150"><tspan class="b">1. A question is queued, a worker runs the agent loop with the scripted demo model (no API key set), the client polls…</tspan></text>
<text class="l" style="animation-name:k6" x="16" y="168">   <tspan class="g">✓</tspan> queued: &quot;Son günlerde performansı aniden bozulan bir kampanya var mı?&quot; → job 4f4ccc60…</text>
<text class="l" style="animation-name:k7" x="16" y="186">   <tspan class="d">tool detect_anomalies(metric=ctr, recent_days=7, baseline_days=28, threshold_pct=40) → ok</tspan></text>
<text class="l" style="animation-name:k8" x="16" y="204">   <tspan class="d">answer: [demo model] &quot;TikTok UGC Video - Kombin&quot; kampanyasında son 7 günde CTR %0.49 ile önceki 28 günün ortalamas…</tspan></text>
<text class="l" style="animation-name:k9" x="16" y="222">   <tspan class="d">2 model calls · 0 in / 0 out tokens · $0.0000</tspan></text>
<text class="l" style="animation-name:k10" x="16" y="240">   <tspan class="g">✓</tspan> the agent queried the database through detect_anomalies</text>
<text class="l" style="animation-name:k11" x="16" y="258">   <tspan class="g">✓</tspan> it found the planted CTR collapse in the TikTok UGC campaign</text>
<text class="l" style="animation-name:k12" x="16" y="276"></text>
<text class="l" style="animation-name:k13" x="16" y="294"><tspan class="b">2. The same Idempotency-Key returns the same job instead of running (and paying for) it twice</tspan></text>
<text class="l" style="animation-name:k14" x="16" y="312">   <tspan class="g">✓</tspan> queued: &quot;Son 7 günde ROAS&#x27;ı en yüksek kampanyam hangisi?&quot; → job bdd1211e…</text>
<text class="l" style="animation-name:k15" x="16" y="330">   <tspan class="g">✓</tspan> 200 with the original job id</text>
<text class="l" style="animation-name:k16" x="16" y="348"></text>
<text class="l" style="animation-name:k17" x="16" y="366"><tspan class="b">3. Writes are proposals: the agent cannot pause a campaign, a person approves it</tspan></text>
<text class="l" style="animation-name:k18" x="16" y="384">   <tspan class="g">✓</tspan> queued: &quot;Display - Prospecting kampanyasını durdur, hiç satış getirmiyor.&quot; → job cd3ce49c…</text>
<text class="l" style="animation-name:k19" x="16" y="402">   <tspan class="d">tool list_campaigns(status=all) → ok</tspan></text>
<text class="l" style="animation-name:k20" x="16" y="420">   <tspan class="d">tool propose_action(kind=pause_campaign, reason=Kullanıcı durdurulmasını istedi; harcama dönüşüm getirmiyor., …) →…</tspan></text>
<text class="l" style="animation-name:k21" x="16" y="438">   <tspan class="d">answer: [demo model] &quot;Display - Prospecting&quot; için durdurma önerisi oluşturdum (id 6b94d487-e65f-4ad1-96ba-3de816c7…</tspan></text>
<text class="l" style="animation-name:k22" x="16" y="456">   <tspan class="d">3 model calls · 0 in / 0 out tokens · $0.0000</tspan></text>
<text class="l" style="animation-name:k23" x="16" y="474">   <tspan class="d">→ 200 [{&quot;id&quot;: &quot;6b94d487-e65f-4ad1-96ba-3de816c709ad&quot;, &quot;kind&quot;: &quot;pause_campaign&quot;, &quot;campaign_id&quot;: &quot;c09&quot;, &quot;campaign_na…</tspan></text>
<text class="l" style="animation-name:k24" x="16" y="492">   <tspan class="g">✓</tspan> a pending pause_campaign proposal exists; the campaign itself is untouched</text>
<text class="l" style="animation-name:k25" x="16" y="510">   <tspan class="d">→ 200 {&quot;id&quot;: &quot;6b94d487-e65f-4ad1-96ba-3de816c709ad&quot;, &quot;status&quot;: &quot;approved&quot;}</tspan></text>
<text class="l" style="animation-name:k26" x="16" y="528">   <tspan class="g">✓</tspan> approved: the change is applied in a locked transaction</text>
<text class="l" style="animation-name:k27" x="16" y="546">   <tspan class="g">✓</tspan> approving the same proposal again is rejected (409)</text>
<text class="l" style="animation-name:k28" x="16" y="564"></text>
<text class="l" style="animation-name:k29" x="16" y="582"><tspan class="b">4. Guardrails are code, not prompt: tripling a budget is refused, the agent proposes the allowed maximum</tspan></text>
<text class="l" style="animation-name:k30" x="16" y="600">   <tspan class="g">✓</tspan> queued: &quot;Marka Araması kampanyasının günlük bütçesini 3 katına çıkar.&quot; → job 4d02084c…</text>
<text class="l" style="animation-name:k31" x="16" y="618">   <tspan class="d">tool list_campaigns(status=all) → ok</tspan></text>
<text class="l" style="animation-name:k32" x="16" y="636">   <tspan class="d">tool propose_action(kind=change_budget, reason=Kullanıcı bütçe artışı istedi., campaign_id=c03, new_daily_budg…) →…</tspan></text>
<text class="l" style="animation-name:k33" x="16" y="654">   <tspan class="d">tool propose_action(kind=change_budget, reason=İstenen artış ±%50 sınırını aşıyor; izin verilen en yüksek artı…) →…</tspan></text>
<text class="l" style="animation-name:k34" x="16" y="672">   <tspan class="d">answer: [demo model] 800 TL&#x27;den 2400 TL&#x27;ye çıkarmak ±%50 kuralına takıldı. Bunun yerine 1200 TL (+%50) önerisi olu…</tspan></text>
<text class="l" style="animation-name:k35" x="16" y="690">   <tspan class="d">4 model calls · 0 in / 0 out tokens · $0.0000</tspan></text>
<text class="l" style="animation-name:k36" x="16" y="708">   <tspan class="g">✓</tspan> the tool rejected the change (±50% limit)</text>
<text class="l" style="animation-name:k37" x="16" y="726">   <tspan class="g">✓</tspan> pending proposal(s) stay within +50%: [1200] TRY (current 800)</text>
<text class="l" style="animation-name:k38" x="16" y="744"></text>
<text class="l" style="animation-name:k39" x="16" y="762"><tspan class="b">5. Tenant isolation: another account cannot see or approve these proposals</tspan></text>
<text class="l" style="animation-name:k40" x="16" y="780">   <tspan class="g">✓</tspan> acc_ev sees none of acc_moda&#x27;s proposals</text>
<text class="l" style="animation-name:k41" x="16" y="798">   <tspan class="g">✓</tspan> approving it as acc_ev: &#x27;action not found&#x27;</text>
<text class="l" style="animation-name:k42" x="16" y="816">   <tspan class="g">✓</tspan> an unknown account is rejected</text>
<text class="l" style="animation-name:k43" x="16" y="834"></text>
<text class="l" style="animation-name:k44" x="16" y="852"><tspan class="b">6. The worker is stopped: requests are still accepted and wait in the queue</tspan></text>
<text class="l" style="animation-name:k45" x="16" y="870">   <tspan class="g">✓</tspan> job is &#x27;queued&#x27; while no worker is running</text>
<text class="l" style="animation-name:k46" x="16" y="888"></text>
<text class="l" style="animation-name:k47" x="16" y="906"><tspan class="b">7. The worker is back and picks the job up</tspan></text>
<text class="l" style="animation-name:k48" x="16" y="924">   <tspan class="g">✓</tspan> done after 1 attempt(s): [demo model] Hesapta 12 kampanya var, 10 tanesi aktif. Hangi kampanyayı incelememi iste…</text>
<text class="l" style="animation-name:k49" x="16" y="942"></text>
<text class="l" style="animation-name:k50" x="16" y="960"><tspan class="b g">Demo finished: queued runs with polling, idempotency, real SQL tools, human approval, code guardrails, tenant isolati…</tspan></text>
<text class="l" style="animation-name:k51" x="16" y="978"></text>
<text class="l" style="animation-name:k52" x="16" y="996">Explore: requests.http · API http://localhost:3001 · stop → make down</text>
</svg>
